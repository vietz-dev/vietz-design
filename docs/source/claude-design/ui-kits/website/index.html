<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vietz.dev — UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: light;
    --bg:          oklch(97% 0.012 85);
    --bg-card:     oklch(98.5% 0.009 85);
    --fg:          oklch(16% 0.01 255);
    --fg-muted:    oklch(48% 0.01 255);
    --fg-faint:    oklch(65% 0.01 255);
    --border:        oklch(82% 0.012 85);
    --border-strong: oklch(70% 0.012 85);
    --accent:    oklch(52% 0.14 38);
    --accent-bg: oklch(94% 0.04 38);
    --shadow-hover:        6px 6px 0 oklch(72% 0.012 85);
    --shadow-hover-strong: 8px 8px 0 oklch(65% 0.016 38);
    --code-bg: oklch(20% 0.01 255);
    --code-fg: oklch(90% 0.01 255);
    --tag-bg: oklch(20% 0.01 255);
    --tag-fg: oklch(97% 0.01 255);
  }

  :root.dark {
    color-scheme: dark;
    --bg:          oklch(13% 0.008 255);
    --bg-card:     oklch(17% 0.008 255);
    --fg:          oklch(93% 0.008 85);
    --fg-muted:    oklch(62% 0.008 255);
    --fg-faint:    oklch(45% 0.008 255);
    --border:        oklch(26% 0.008 255);
    --border-strong: oklch(35% 0.008 255);
    --accent:    oklch(70% 0.14 38);
    --accent-bg: oklch(22% 0.06 38);
    --shadow-hover:        6px 6px 0 oklch(8% 0.008 255);
    --shadow-hover-strong: 8px 8px 0 oklch(38% 0.08 38);
    --code-bg: oklch(10% 0.008 255);
    --code-fg: oklch(85% 0.01 255);
    --tag-bg: oklch(80% 0.008 85);
    --tag-fg: oklch(16% 0.01 255);
  }

  html, body, #root {
    min-height: 100vh;
  }

  body {
    font-family: "IBM Plex Sans", sans-serif;
    background: var(--bg);
    color: var(--fg);
    transition: background 0.3s, color 0.3s;
  }

  a { color: inherit; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

  ::selection { background: var(--accent-bg); color: var(--fg); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="BlogCard.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>

<script type="text/babel">
const App = () => {
  const [dark, setDark] = React.useState(false);
  const [page, setPage] = React.useState('home');
  const [activePost, setActivePost] = React.useState(null);

  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  const navigate = (dest, data) => {
    if (dest === 'post') { setActivePost(data); setPage('post'); }
    else { setPage(dest); setActivePost(null); }
    document.getElementById('root').scrollTop = 0;
    window.scrollTo(0, 0);
  };

  const renderPage = () => {
    switch (page) {
      case 'home':     return <HomeScreen onNavigate={navigate} />;
      case 'blog':     return <BlogScreen onNavigate={navigate} />;
      case 'post':     return <PostScreen post={activePost} onBack={() => navigate('blog')} />;
      case 'projects': return <ProjectsScreen />;
      case 'cv':       return <CVScreen />;
      default:         return <HomeScreen onNavigate={navigate} />;
    }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100vh' }}>
      <Nav dark={dark} onToggleDark={() => setDark(d => !d)} onNavigate={navigate} currentPage={page} />
      <main style={{ flex: 1 }}>
        {renderPage()}
      </main>
      <Footer />
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
