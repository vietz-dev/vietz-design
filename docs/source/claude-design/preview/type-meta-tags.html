<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(97% 0.012 85); padding: 20px 24px; font-family: "IBM Plex Mono", monospace; color: oklch(16% 0.01 255); }
  .row { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 10px; color: oklch(65% 0.01 255); margin-bottom: 2px; }
  .muted-meta { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: oklch(65% 0.01 255); }
  .tag { display: inline-flex; align-items: center; font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.08em; border-radius: 3px; padding: 4px 8px; }
  .tag-dark { background: oklch(20% 0.01 255); color: oklch(97% 0.01 255); }
  .tag-accent { background: oklch(94% 0.04 38); color: oklch(52% 0.14 38); border: 1px solid oklch(52% 0.14 38); }
  .inline-code { background: oklch(94% 0.04 38); color: oklch(52% 0.14 38); border: 1px solid color-mix(in oklab, oklch(52% 0.14 38) 45%, transparent); padding: 0.15rem 0.35rem; border-radius: 4px; font-family: "IBM Plex Mono", monospace; font-size: 13px; }
  .tags-row { display: flex; gap: 6px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="row">
  <div class="col">
    <div><div class="label">muted-meta — Mono 13px, fg-faint</div><div class="muted-meta">Jan 26, 2026 · 5 min read</div></div>
    <div><div class="label">inline-code</div><code class="inline-code">ServeHTTP</code></div>
  </div>
  <div class="col">
    <div class="label">tag-dark — Mono 11px, tracking 0.08em</div>
    <div class="tags-row">
      <span class="tag tag-dark">golang</span>
      <span class="tag tag-dark">reverse_proxy</span>
      <span class="tag tag-dark">traefik</span>
    </div>
    <div class="label">tag-accent</div>
    <div class="tags-row">
      <span class="tag tag-accent">featured</span>
      <span class="tag tag-accent">new</span>
    </div>
  </div>
</div>
</body>
</html>
