<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(97% 0.012 85); padding: 20px 24px; font-family: "IBM Plex Mono", monospace; color: oklch(16% 0.01 255); }
  .section-label { font-size: 10px; color: oklch(65% 0.01 255); margin-bottom: 10px; }
  .icons { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .icon-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .icon-item svg { width: 22px; height: 22px; stroke: oklch(16% 0.01 255); stroke-width: 1.75; fill: none; }
  .icon-item svg.accent { stroke: oklch(52% 0.14 38); }
  .icon-item span { font-size: 9px; color: oklch(65% 0.01 255); }
  .simple-row { display: flex; gap: 16px; align-items: center; }
  .simple-row img { width: 22px; height: 22px; opacity: 0.8; }
  .simple-row span { font-size: 10px; color: oklch(65% 0.01 255); }
</style>
</head>
<body>
  <div class="section-label">Lucide Icons — 1.75px stroke, used for UI chrome</div>
  <div class="icons">
    <div class="icon-item"><i data-lucide="sun" class="icon"></i><span>sun</span></div>
    <div class="icon-item"><i data-lucide="moon" class="icon"></i><span>moon</span></div>
    <div class="icon-item"><i data-lucide="menu" class="icon"></i><span>menu</span></div>
    <div class="icon-item"><i data-lucide="x" class="icon"></i><span>x</span></div>
    <div class="icon-item"><i data-lucide="arrow-left" class="icon"></i><span>arrow-left</span></div>
    <div class="icon-item"><i data-lucide="external-link" class="icon"></i><span>external-link</span></div>
    <div class="icon-item"><i data-lucide="github" class="icon"></i><span>github</span></div>
    <div class="icon-item"><i data-lucide="rss" class="icon"></i><span>rss</span></div>
    <div class="icon-item"><i data-lucide="tag" class="icon accent"></i><span style="color:oklch(52% 0.14 38)">accent</span></div>
    <div class="icon-item"><i data-lucide="pencil" class="icon"></i><span>pencil</span></div>
    <div class="icon-item"><i data-lucide="folder" class="icon"></i><span>folder</span></div>
    <div class="icon-item"><i data-lucide="terminal" class="icon"></i><span>terminal</span></div>
    <div class="icon-item"><i data-lucide="link" class="icon"></i><span>link</span></div>
    <div class="icon-item"><i data-lucide="user" class="icon"></i><span>user</span></div>
  </div>
  <div class="section-label">Simple Icons — brand logos, flat SVG fill</div>
  <div class="simple-row">
    <img src="https://cdn.simpleicons.org/github/16/0.01/255" alt="github" onerror="this.style.display='none'">
    <img src="https://cdn.simpleicons.org/typescript" alt="ts" style="width:20px;height:20px">
    <img src="https://cdn.simpleicons.org/go" alt="go" style="width:20px;height:20px">
    <img src="https://cdn.simpleicons.org/react" alt="react" style="width:20px;height:20px">
    <img src="https://cdn.simpleicons.org/astro" alt="astro" style="width:20px;height:20px">
    <img src="https://cdn.simpleicons.org/kubernetes" alt="k8s" style="width:20px;height:20px">
    <span>via cdn.simpleicons.org/{slug}</span>
  </div>
<script>
  document.querySelectorAll('[data-lucide]').forEach(el => {
    el.style.display = 'inline-block';
    el.style.width = '22px';
    el.style.height = '22px';
  });
  lucide.createIcons();
  document.querySelectorAll('[data-lucide] svg').forEach(svg => {
    svg.style.strokeWidth = '1.75';
    svg.style.fill = 'none';
    svg.style.stroke = svg.closest('.accent') ? 'oklch(52% 0.14 38)' : 'oklch(16% 0.01 255)';
    svg.style.width = '22px';
    svg.style.height = '22px';
  });
</script>
</body>
</html>
