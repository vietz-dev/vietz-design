<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(97% 0.012 85); font-family: "IBM Plex Sans", sans-serif; padding: 20px 24px; color: oklch(16% 0.01 255); }
  .page-title { font-family: "IBM Plex Mono", monospace; font-size: clamp(36px, 6vw, 52px); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .display-title { font-family: "IBM Plex Mono", monospace; font-size: clamp(28px, 5vw, 44px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 8px; }
  .meta { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: oklch(65% 0.01 255); margin-bottom: 4px; }
  .divider { height: 1px; background: oklch(82% 0.012 85); margin: 12px 0; }
</style>
</head>
<body>
  <div class="meta">page-title — IBM Plex Mono 700, clamp(36–52px), tracking -0.02em</div>
  <div class="page-title">Writing</div>
  <div class="divider"></div>
  <div class="meta">display-title — IBM Plex Mono 700, clamp(28–44px), line-height 1.15</div>
  <div class="display-title">Building a minimal reverse proxy in Go</div>
</body>
</html>
