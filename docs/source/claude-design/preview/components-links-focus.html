<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(97% 0.012 85); padding: 20px 24px; font-family: "IBM Plex Sans", sans-serif; color: oklch(16% 0.01 255); }
  .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .label { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: oklch(65% 0.01 255); margin-bottom: 2px; }
  .text-link { color: oklch(16% 0.01 255); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; cursor: pointer; }
  .focus-demo { outline: 2px solid oklch(52% 0.14 38); outline-offset: 3px; border-radius: 2px; }
  .card-focus { border: 1.5px solid oklch(70% 0.012 85); border-radius: 10px; padding: 12px 16px; background: oklch(98.5% 0.009 85); font-size: 13px; display: inline-block; outline: 2px solid oklch(52% 0.14 38); outline-offset: 3px; }
  .blockquote { border-left: 4px solid oklch(70% 0.012 85); padding-left: 16px; color: oklch(16% 0.01 255); font-size: 14px; line-height: 1.7; font-style: italic; }
  .selection-demo { background: oklch(94% 0.04 38); color: oklch(16% 0.01 255); padding: 2px 4px; border-radius: 2px; font-size: 14px; }
</style>
</head>
<body>
<div class="row">
  <div class="col">
    <div>
      <div class="label">text-link — underline, offset 3px, fg color</div>
      <a class="text-link" href="#">Read the full post →</a>
    </div>
    <div>
      <div class="label">::selection — accent-bg tint</div>
      <span class="selection-demo">selected text looks like this</span>
    </div>
  </div>
  <div class="col">
    <div>
      <div class="label">:focus-visible — 2px accent outline, offset 3px</div>
      <span class="text-link focus-demo" tabindex="0">focused link</span>
    </div>
    <div>
      <div class="label">card focus-visible</div>
      <div class="card-focus">focused card</div>
    </div>
  </div>
  <div class="col">
    <div>
      <div class="label">blockquote — 4px left border, border-strong</div>
      <blockquote class="blockquote">I value clarity over cleverness.</blockquote>
    </div>
  </div>
</div>
</body>
</html>
