<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: oklch(97% 0.012 85); padding: 20px 24px; font-family: "IBM Plex Mono", monospace; color: oklch(16% 0.01 255); }
  .row { display: flex; gap: 40px; align-items: center; }
  .logo-block { display: flex; align-items: center; gap: 12px; }
  .favicon { width: 48px; height: 48px; }
  .wordmark { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: oklch(16% 0.01 255); }
  .wordmark span { color: oklch(52% 0.14 38); }
  .label { font-size: 10px; color: oklch(65% 0.01 255); margin-top: 4px; }
  .divider { width: 1px; height: 60px; background: oklch(82% 0.012 85); }
  .on-dark { background: oklch(13% 0.008 255); border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
  .wordmark-dark { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: oklch(93% 0.008 85); }
  .wordmark-dark span { color: oklch(70% 0.14 38); }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="logo-block">
        <svg class="favicon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1"></stop>
              <stop offset="50%" style="stop-color:#FF8C42;stop-opacity:1"></stop>
              <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1"></stop>
            </linearGradient>
          </defs>
          <path d="M100,20 C130,20 150,30 165,50 C180,70 185,90 180,110 C175,130 165,145 145,160 C125,175 105,180 85,175 C65,170 45,155 30,135 C15,115 15,90 20,70 C25,50 40,30 60,23 C73,18 87,18 100,20 Z" fill="url(#og)"></path>
        </svg>
        <div>
          <div class="wordmark">vietz<span>.dev</span></div>
          <div class="label">IBM Plex Mono 700, accent on .dev</div>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="on-dark">
        <svg width="40" height="40" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="og2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FF6B35"></stop><stop offset="100%" style="stop-color:#FFA500"></stop></linearGradient></defs>
          <path d="M100,20 C130,20 150,30 165,50 C180,70 185,90 180,110 C175,130 165,145 145,160 C125,175 105,180 85,175 C65,170 45,155 30,135 C15,115 15,90 20,70 C25,50 40,30 60,23 C73,18 87,18 100,20 Z" fill="url(#og2)"></path>
        </svg>
        <div class="wordmark-dark">vietz<span>.dev</span></div>
      </div>
      <div class="label" style="margin-top:6px">dark mode — accent brightens to oklch(70% 0.14 38)</div>
    </div>
  </div>
</body>
</html>
